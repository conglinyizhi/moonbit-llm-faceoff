name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The toolchain under ~/.moon is the slow part to fetch and it changes
      # only when a dependency is bumped. The modules' own dependencies land in
      # .mooncakes/ inside the checkout and are fetched fresh each run.
      - name: Cache the MoonBit toolchain
        uses: actions/cache@v5
        with:
          path: ~/.moon
          key: moon-${{ runner.os }}-${{ hashFiles('moon.mod') }}

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          moon version --all
          gcc --version | head -1
          make --version | head -1

      # `make ci` is check + test + smoke + build the page. It is the same
      # command anyone can run locally, so there is one definition of
      # "passing" rather than two.
      #
      # deps is not part of it any more: `moon update` hits the network and
      # costs 6-45s, which is exactly the cost a local iteration cannot afford.
      # A fresh checkout still needs it once, hence the step above.
      #
      # scripts/web-e2e.sh is deliberately NOT part of it: it drives a real
      # Chromium and waits in real time, which makes it the flakiest thing in
      # the repo. Run it locally with `make e2e`. To run it here too, install a
      # browser and add a separate job — do not fold it into this one, or a
      # timing hiccup will start failing unrelated pull requests.
      - name: Fetch dependencies
        run: make deps

      - name: make ci
        run: make ci

      # 用户数据默认落在用户目录，且默认值不能退化回仓库内的相对路径。
      # 断言的是「值以 faceoff/runs 结尾」，这样无论 XDG_DATA_HOME 有没有被 runner
      # 设过都成立；真正验 Windows 映射的那条在 windows job 里。
      - name: Default data directories
        timeout-minutes: 5
        run: |
          out=$(moon run --target native web/cmd/server -- --print-dirs)
          echo "$out"
          case "$out" in
            *"runs="*"faceoff/runs"*) ;;
            *) echo "runs/ did not resolve into the user directory"; exit 1 ;;
          esac
          case "$out" in
            *"presets="*"faceoff/presets.json"*) ;;
            *) echo "presets.json did not resolve into the user directory"; exit 1 ;;
          esac

  # The same scripts on Windows. This job exists because "the scripts are
  # MoonBit now, so they are cross-platform" is a claim, and a claim without a
  # runner is a guess: everything here goes through @process, @fs and @http
  # rather than grep/sed/curl, and the server spawns bench directly instead of
  # through /bin/sh. If this job passes, that is evidence; if it fails, that is a
  # finding.
  #
  # Not run here: `make ci`. It needs make plus a POSIX shell, and the point of
  # this job is precisely that the checks no longer need either.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache the MoonBit toolchain
        uses: actions/cache@v5
        with:
          path: ~/.moon
          key: moon-${{ runner.os }}-${{ hashFiles('moon.mod') }}

      - name: Install MoonBit
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Native builds need a C compiler and linker on PATH.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Versions
        shell: pwsh
        run: |
          moon version --all
          Get-Command cl.exe | Select-Object -ExpandProperty Source

      # A fresh checkout has the bundled index, not the downloaded one, and
      # `make deps` is not part of `make ci` any more (it hits the network).
      - name: Fetch dependencies
        shell: pwsh
        run: |
          moon update
          exit $LASTEXITCODE

      # 最便宜的一步放最前面：格式不过就不必跑后面的单测与两个套件
      - name: Formatting
        shell: pwsh
        run: |
          moon fmt --check
          exit $LASTEXITCODE

      # 单测把「Windows 的映射」当字符串验过（LOCALAPPDATA 存在时用 %LOCALAPPDATA%），
      # 但真实环境只有真 Windows 上才看得见。走环境变量而不用命令行参数：参数的传递
      # 方式不值得赌，万一没传进去服务端会起来并卡住，所以超时也兜了一层。
      - name: Default data directories
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:LLM_WEB_PRINT_DIRS = "1"
          $out = moon run --target native web/cmd/server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $out
          if ($out -notlike "*$env:LOCALAPPDATA\faceoff\runs*") {
            Write-Error "runs/ is not under LOCALAPPDATA"; exit 1
          }
          if ($out -notlike "*$env:LOCALAPPDATA\faceoff\presets.json*") {
            Write-Error "presets.json is not under LOCALAPPDATA"; exit 1
          }

      - name: Unit tests
        shell: pwsh
        run: |
          moon test --target native
          exit $LASTEXITCODE

      # The two end-to-end suites: no shell, no curl, no grep.
      #
      # Built, copied, then run — not `moon run`. Each .mbtx builds into its own
      # target-dir now (scripts/_build/mbtx/<name>/...), so a running suite no
      # longer collides with the mock endpoint it builds. The copy stays: the
      # runner then holds no build output and $LASTEXITCODE is the suite's own.
      #
      # The built binary is *found*, not hardcoded: the path comes from
      # --target-dir and moon appends the source file name again, so the exact
      # depth already changed once and a hardcoded path silently rotted away.
      - name: smoke end to end
        shell: pwsh
        run: |
          moon build --target native --target-dir scripts/_build/mbtx/smoke.mbtx scripts/smoke.mbtx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $single = Get-ChildItem scripts/_build/mbtx/smoke.mbtx -Recurse -Filter single.exe | Select-Object -First 1
          if (-not $single) { Write-Error "no single.exe under scripts/_build/mbtx/smoke.mbtx"; exit 1 }
          Copy-Item $single.FullName scripts/_build/smoke.exe -Force
          scripts/_build/smoke.exe
          exit $LASTEXITCODE

      - name: server HTTP contract
        shell: pwsh
        run: |
          moon build --target native --target-dir scripts/_build/mbtx/server-api.mbtx scripts/server-api.mbtx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $single = Get-ChildItem scripts/_build/mbtx/server-api.mbtx -Recurse -Filter single.exe | Select-Object -First 1
          if (-not $single) { Write-Error "no single.exe under scripts/_build/mbtx/server-api.mbtx"; exit 1 }
          Copy-Item $single.FullName scripts/_build/server-api.exe -Force
          scripts/_build/server-api.exe
          exit $LASTEXITCODE
