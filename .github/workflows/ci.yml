name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The toolchain under ~/.moon is the slow part to fetch and it changes
      # only when a dependency is bumped. The modules' own dependencies land in
      # .mooncakes/ inside the checkout and are fetched fresh each run.
      - name: Cache the MoonBit toolchain
        uses: actions/cache@v5
        with:
          path: ~/.moon
          key: moon-${{ runner.os }}-${{ hashFiles('moon.mod', 'web/moon.mod') }}

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          moon version --all
          gcc --version | head -1
          make --version | head -1

      # `make ci` is deps + check + test + smoke + build the page. It is the
      # same command anyone can run locally, so there is one definition of
      # "passing" rather than two.
      #
      # scripts/web-e2e.sh is deliberately NOT part of it: it drives a real
      # Chromium and waits in real time, which makes it the flakiest thing in
      # the repo. Run it locally with `make e2e`. To run it here too, install a
      # browser and add a separate job — do not fold it into this one, or a
      # timing hiccup will start failing unrelated pull requests.
      - name: make ci
        run: make ci

  # The same scripts on Windows. This job exists because "the scripts are
  # MoonBit now, so they are cross-platform" is a claim, and a claim without a
  # runner is a guess: everything here goes through @process, @fs and @http
  # rather than grep/sed/curl, and the server spawns bench directly instead of
  # through /bin/sh. If this job passes, that is evidence; if it fails, that is a
  # finding.
  #
  # Not run here: `make ci`. It needs make plus a POSIX shell, and the point of
  # this job is precisely that the checks no longer need either.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache the MoonBit toolchain
        uses: actions/cache@v5
        with:
          path: ~/.moon
          key: moon-${{ runner.os }}-${{ hashFiles('moon.mod', 'web/moon.mod') }}

      - name: Install MoonBit
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Native builds need a C compiler and linker on PATH.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Versions
        shell: pwsh
        run: |
          moon version --all
          Get-Command cl.exe | Select-Object -ExpandProperty Source

      - name: Unit tests
        shell: pwsh
        run: |
          moon test --target native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location web
          moon test --target native
          exit $LASTEXITCODE

      # The two end-to-end suites: no shell, no curl, no grep.
      - name: smoke end to end
        run: moon run --target native scripts/smoke.mbtx

      - name: server HTTP contract
        run: moon run --target native scripts/server-api.mbtx
